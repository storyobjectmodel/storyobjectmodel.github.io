<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Tools subscribe to a shared story object over a bus; a rulebook of Skills says what each tool does with it">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#5B6670}
.lbl{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:14px;fill:#111517}
.tool{fill:#FFFFFF;stroke:#DFE4E7}
.tap{stroke:#8E9BA5;stroke-width:1.5}
.bus{stroke:#111517;stroke-width:5}
</style>
<rect width="960" height="340" fill="#F4F6F7"/>
<g>
  <rect class="tool" x="30" y="30" width="150" height="58" rx="6"/><text x="42" y="55" class="lbl">Planning</text><text x="105" y="74" text-anchor="middle">subscribes</text>
  <rect class="tool" x="215" y="30" width="150" height="58" rx="6"/><text x="227" y="55" class="lbl">Rundown</text><text x="290" y="74" text-anchor="middle">publishes · subscribes</text>
  <rect class="tool" x="400" y="30" width="150" height="58" rx="6"/><text x="412" y="55" class="lbl">Graphics</text><text x="475" y="74" text-anchor="middle">subscribes</text>
  <rect class="tool" x="585" y="30" width="150" height="58" rx="6"/><text x="597" y="55" class="lbl">Transcription</text><text x="660" y="74" text-anchor="middle">publishes</text>
  <rect class="tool" x="770" y="30" width="160" height="58" rx="6"/><text x="782" y="55" class="lbl">Social publish</text><text x="850" y="74" text-anchor="middle">subscribes</text>
  <line class="tap" x1="105" y1="88" x2="105" y2="160"/><line class="tap" x1="290" y1="88" x2="290" y2="160"/><line class="tap" x1="475" y1="88" x2="475" y2="160"/><line class="tap" x1="660" y1="88" x2="660" y2="160"/><line class="tap" x1="850" y1="88" x2="850" y2="160"/>
</g>
<line class="bus" x1="40" y1="160" x2="920" y2="160"/>
<text x="40" y="185" class="lbl">THE BUS</text><text x="40" y="202">publish and subscribe · JSON envelope · nobody addresses anybody · media never travels here</text>
<g transform="translate(560,235)">
  <g transform="translate(-12,-12)"><rect x="0" y="2" width="17" height="4.6" fill="#111517"/><rect x="5" y="9.7" width="19" height="4.6" fill="#0B7C86"/><rect x="0" y="17.4" width="17" height="4.6" fill="#111517"/></g><line class="tap" x1="0" y1="-12" x2="0" y2="-75"/>
  <text x="34" y="-4" class="lbl">THE STORY</text><text x="34" y="14">one live object · decided, cleared, held</text>
</g>
<g transform="translate(40,250)">
  <rect x="0" y="-16" width="26" height="34" fill="#FFFFFF" stroke="#111517"/><line x1="6" y1="-6" x2="20" y2="-6" stroke="#111517" stroke-width="2"/><line x1="6" y1="1" x2="20" y2="1" stroke="#111517" stroke-width="2"/><line x1="6" y1="8" x2="20" y2="8" stroke="#111517" stroke-width="2"/>
  <text x="38" y="-2" class="lbl">THE RULEBOOK</text><text x="38" y="16">Skills your newsroom writes · declare, never act · silence is a valid outcome</text>
</g>
<text x="40" y="318">No orchestrator and no central application. Each tool reads the story and decides for itself.</text>
</svg>
